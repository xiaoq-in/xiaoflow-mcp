name = "xiaoflow-mcp"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = [ "nodejs_compat" ]

workers_dev = true
route = { pattern = "mcp.xiaoflow.com", custom_domain = true }

[vars]
XIAOFLOW_API_URL = "https://api.xiaoflow.com"
# XIAOFLOW_API_KEY should be set via secrets: wrangler secret put XIAOFLOW_API_KEY

[[durable_objects.bindings]]
name = "MCP_SESSION"
class_name = "McpSession"

[[migrations]]
tag = "v1"
new_classes = ["McpSession"]
