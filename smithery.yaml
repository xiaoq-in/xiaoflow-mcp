# Smithery configuration for xiaoflow-mcp-server
# https://smithery.ai/
startCommand:
  type: stdio
  config:
    command: npx
    args:
      - -y
      - xiaoflow-mcp-server
  env:
    XIAOFLOW_API_KEY: "YOUR_XIAOFLOW_API_KEY"

configSchema:
  type: object
  properties:
    apiKey:
      type: string
      description: "Your XiaoFlow API Key (from https://www.xiaoflow.com/user/api-keys)"
  required:
    - apiKey
